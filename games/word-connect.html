<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🔤 توصيل الكلمات - Word Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#0d001f 0%,#1a0035 50%,#0a0020 100%);font-family:'Tajawal',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;}
#root{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}


.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);border-bottom:1px solid rgba(100,200,255,.15);flex-shrink:0}
.back{background:rgba(100,200,255,.15);border:1px solid rgba(100,200,255,.3);color:#fff;padding:6px 14px;border-radius:18px;cursor:pointer;font-size:13px;font-family:'Tajawal',sans-serif;transition:.2s}
.back:hover{background:rgba(100,200,255,.35)}
.stats{display:flex;gap:8px}
.spill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:4px 12px;font-size:13px;display:flex;align-items:center;gap:4px}
.spill b{color:#ffd700}


.cat-bar{background:linear-gradient(135deg,rgba(100,200,255,.12),rgba(0,150,200,.08));border-bottom:1px solid rgba(100,200,255,.1);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cat-name{font-size:16px;font-weight:900;color:#64ffda;text-shadow:0 0 10px rgba(100,255,218,.4)}
.cat-progress{font-size:12px;color:rgba(255,255,255,.5)}


.hints-row{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;flex-shrink:0;justify-content:center}
.hint-chip{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:20px;padding:4px 14px;font-size:13px;color:rgba(255,255,255,.3);letter-spacing:2px;transition:.4s;font-weight:700}
.hint-chip.found{background:rgba(100,255,218,.15);border-color:#64ffda;color:#64ffda;letter-spacing:1px;animation:chip-pop .5s cubic-bezier(.68,-.55,.27,1.55)}
@keyframes chip-pop{0%{transform:scale(.7)}50%{transform:scale(1.2)}100%{transform:scale(1)}}


.selected-display{text-align:center;padding:8px 14px;flex-shrink:0}
.sel-word{font-size:24px;font-weight:900;color:#ffd700;letter-spacing:4px;min-height:36px;text-shadow:0 0 12px rgba(255,215,0,.4);transition:.2s}
.sel-word.error{color:#ff4466;letter-spacing:2px}


.grid-area{flex:1;display:flex;align-items:center;justify-content:center;padding:6px;min-height:0;position:relative}
.grid{display:inline-grid;gap:5px;touch-action:none}
.cell{display:flex;align-items:center;justify-content:center;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);font-size:20px;font-weight:900;cursor:pointer;transition:.12s;position:relative;-webkit-tap-highlight-color:transparent}
.cell:active,.cell.sel{background:linear-gradient(135deg,rgba(100,255,218,.3),rgba(0,180,150,.25));border-color:#64ffda;transform:scale(1.08);box-shadow:0 0 12px rgba(100,255,218,.4)}
.cell.found{background:linear-gradient(135deg,rgba(100,255,218,.15),rgba(0,160,130,.12));border-color:rgba(100,255,218,.35);color:#64ffda}
.cell.wrong-flash{animation:wrong-cell .35s ease}
@keyframes wrong-cell{0%,100%{background:rgba(255,255,255,.06)}50%{background:rgba(255,50,80,.3);border-color:#ff4466}}


.bottom{display:flex;gap:8px;padding:10px 14px;flex-shrink:0;background:rgba(0,0,0,.3)}
.clear-btn{flex:1;background:rgba(255,80,100,.15);border:1.5px solid rgba(255,80,100,.3);color:#ff8899;padding:12px;border-radius:16px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;transition:.2s}
.clear-btn:hover{background:rgba(255,80,100,.3)}
.submit-btn{flex:2;background:linear-gradient(135deg,#64ffda,#00bfa5);border:none;color:#0d001f;padding:12px;border-radius:16px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:900;transition:.2s;box-shadow:0 4px 15px rgba(100,255,218,.25)}
.submit-btn:hover{transform:scale(1.03);box-shadow:0 6px 20px rgba(100,255,218,.4)}


.win-ov{position:fixed;inset:0;background:rgba(0,0,15,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;animation:fadein .4s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.win-ico{font-size:72px;animation:bounce-in .8s cubic-bezier(.68,-.55,.27,1.55)}
@keyframes bounce-in{from{transform:scale(0)rotate(-180deg)}to{transform:scale(1)rotate(0)}}
.win-title{font-size:30px;font-weight:900;color:#64ffda;text-shadow:0 0 20px #64ffda;margin:12px 0 6px}
.win-score{font-size:48px;font-weight:900;color:#ffd700;margin:4px 0}
.win-btn{background:linear-gradient(135deg,#64ffda,#00bfa5);border:none;color:#0d001f;padding:14px 30px;border-radius:24px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:17px;font-weight:900;margin-top:16px;box-shadow:0 6px 20px rgba(100,255,218,.4);transition:.2s}
.win-btn:hover{transform:scale(1.05)}


.spark{position:fixed;pointer-events:none;font-size:22px;animation:spark-fly 1.2s ease-out forwards}
@keyframes spark-fly{0%{opacity:1;transform:translateY(0)rotate(0)}100%{opacity:0;transform:translateY(-100px)rotate(720deg)}}
</style>
</head>
<body>
<div id="root">
  <div class="topbar">
    <button class="back" onclick="location.href='../index.html'">← رجوع</button>
    <div class="stats">
      <div class="spill">⭐ <b id="score-disp">0</b></div>
      <div class="spill">✅ <b id="found-disp">0/5</b></div>
    </div>
  </div>
  <div class="cat-bar">
    <div class="cat-name" id="cat-nm">🐾 الحيوانات</div>
    <div class="cat-progress" id="cat-num">1 / 5</div>
  </div>
  <div class="hints-row" id="hints"></div>
  <div class="selected-display"><div class="sel-word" id="sel-word">اختر حروفاً</div></div>
  <div class="grid-area"><div class="grid" id="grid"></div></div>
  <div class="bottom">
    <button class="clear-btn" onclick="clearSel()">✕ مسح</button>
    <button class="submit-btn" onclick="submitWord()">✔ تأكيد الكلمة</button>
  </div>
</div>

<div class="win-ov" id="win-ov" style="display:none">
  <div class="win-ico">🎉</div>
  <div class="win-title">أحسنت!</div>
  <div win-score class="win-score" id="win-sc">0</div>
  <div style="font-size:14px;color:rgba(255,255,255,.5);margin-bottom:4px">وجدت جميع الكلمات!</div>
  <button class="win-btn" onclick="nextCat()">الفئة التالية ➡️</button>
  <button class="back" style="margin-top:10px" onclick="location.href='../index.html'">الرئيسية</button>
</div>

<script>
const CATS=[
  {name:'🐾 الحيوانات',words:['أسد','كلب','قطة','بقرة','ذئب','نمر','فيل','دب'],hint:'حيوانات'},
  {name:'🍎 الفواكه',words:['تفاح','برتقال','موز','عنب','كمثرى','خوخ','مانجو','بطيخ'],hint:'فواكه'},
  {name:'🌈 الألوان',words:['أحمر','أزرق','أخضر','أصفر','أبيض','أسود','وردي','بنفسجي'],hint:'ألوان'},
  {name:'🏠 المنزل',words:['باب','نافذة','سرير','كرسي','مطبخ','حمام','غرفة','مدخل'],hint:'منزل'},
  {name:'🌍 الطبيعة',words:['شمس','قمر','نجمة','سحاب','مطر','جبل','بحر','نهر'],hint:'طبيعة'},
];
const ARABIC='ابتثجحخدذرزسشصضطظعغفقكلمنهوي';
let catIdx=0,score=0,foundWords=new Set(),selCells=[],selLetters='';
let gridLetters=[],GCOLS=6,GROWS=6,CELL_SIZE=0;
let canInteract=true;

function initCat(){
  foundWords.clear();selCells=[];selLetters='';
  const cat=CATS[catIdx];
  document.getElementById('cat-nm').textContent=cat.name;
  document.getElementById('sel-word').textContent='اختر حروفاً';
  document.getElementById('sel-word').className='sel-word';
  buildGrid(cat.words.slice(0,5));
  buildHints(cat.words.slice(0,5));
  updateStats();
}
function buildGrid(words){
  
  gridLetters=Array.from({length:GROWS},()=>Array.from({length:GCOLS},()=>ARABIC[Math.floor(Math.random()*ARABIC.length)]));
  
  words.forEach((word,wi)=>{
    const row=wi;
    for(let c=0;c<Math.min(word.length,GCOLS);c++) gridLetters[row][c]=word[c];
    
    for(let c=word.length;c<GCOLS;c++) gridLetters[row][c]=ARABIC[Math.floor(Math.random()*ARABIC.length)];
  });
  renderGrid();
}
function renderGrid(){
  const g=document.getElementById('grid');
  const area=document.querySelector('.grid-area');
  const aw=area.clientWidth-12, ah=area.clientHeight-12;
  CELL_SIZE=Math.min(Math.floor(aw/GCOLS),Math.floor(ah/GROWS),70);
  g.style.gridTemplateColumns=`repeat(${GCOLS},${CELL_SIZE}px)`;
  g.innerHTML='';
  for(let r=0;r<GROWS;r++) for(let c=0;c<GCOLS;c++){
    const div=document.createElement('div');
    div.className='cell';
    div.style.width=div.style.height=CELL_SIZE+'px';
    div.style.fontSize=Math.round(CELL_SIZE*.4)+'px';
    div.textContent=gridLetters[r][c];
    div.dataset.r=r;div.dataset.c=c;
    div.addEventListener('click',()=>toggleCell(r,c,div));
    div.addEventListener('touchstart',e=>{e.preventDefault();toggleCell(r,c,div);},{passive:false});
    g.appendChild(div);
  }
}
function toggleCell(r,c,div){
  if(!canInteract)return;
  const key=r+','+c;
  
  const lastKey=selCells.length>0?selCells[selCells.length-1].key:null;
  if(key===lastKey){
    selCells.pop();selLetters=selLetters.slice(0,-1);
    div.classList.remove('sel');
    updateSelWord();return;
  }
  if(selCells.find(s=>s.key===key))return;
  selCells.push({key,r,c});selLetters+=gridLetters[r][c];
  div.classList.add('sel');
  updateSelWord();
}
function updateSelWord(){
  document.getElementById('sel-word').textContent=selLetters||'اختر حروفاً';
  document.getElementById('sel-word').className='sel-word';
}
function clearSel(){
  selCells.forEach(({r,c})=>{
    const el=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    if(el&&!el.classList.contains('found'))el.classList.remove('sel');
  });
  selCells=[];selLetters='';updateSelWord();
}
function submitWord(){
  if(!selLetters||!canInteract)return;
  const words=CATS[catIdx].words.slice(0,5);
  if(words.includes(selLetters)&&!foundWords.has(selLetters)){
    foundWords.add(selLetters);score+=selLetters.length*15+30;
    
    selCells.forEach(({r,c})=>{
      const el=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
      if(el){el.classList.remove('sel');el.classList.add('found');}
    });
    
    document.querySelectorAll('.hint-chip').forEach(h=>{
      if(h.dataset.word===selLetters)h.classList.add('found');
    });
    spawnSparks();selCells=[];selLetters='';
    document.getElementById('sel-word').textContent='✅ رائع!';
    updateStats();
    if(foundWords.size>=5) setTimeout(showWin,700);
    else setTimeout(()=>{document.getElementById('sel-word').textContent='اختر حروفاً';},800);
  } else {
    
    canInteract=false;
    document.getElementById('sel-word').className='sel-word error';
    document.getElementById('sel-word').textContent='❌ حاول مجدداً';
    selCells.forEach(({r,c})=>{
      const el=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
      if(el)el.classList.add('wrong-flash');
    });
    setTimeout(()=>{
      selCells.forEach(({r,c})=>{
        const el=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
        if(el){el.classList.remove('sel','wrong-flash');}
      });
      selCells=[];selLetters='';
      document.getElementById('sel-word').textContent='اختر حروفاً';
      document.getElementById('sel-word').className='sel-word';
      canInteract=true;
    },700);
  }
}
function buildHints(words){
  const h=document.getElementById('hints');h.innerHTML='';
  words.forEach(w=>{
    const d=document.createElement('div');d.className='hint-chip';
    d.textContent=Array.from(w).map(()=>'_').join(' ');
    d.dataset.word=w;h.appendChild(d);
  });
}
function updateStats(){
  document.getElementById('score-disp').textContent=score;
  document.getElementById('found-disp').textContent=foundWords.size+'/5';
  document.getElementById('cat-num').textContent=(catIdx+1)+' / '+CATS.length;
  
  document.querySelectorAll('.hint-chip').forEach(h=>{
    if(foundWords.has(h.dataset.word)){h.textContent=h.dataset.word;h.classList.add('found');}
  });
}
function spawnSparks(){
  ['⭐','✨','🌟','💫','🎉'].forEach((em,i)=>{
    const d=document.createElement('div');d.className='spark';d.textContent=em;
    d.style.cssText=`left:${15+Math.random()*70}%;top:${20+Math.random()*50}%;animation-delay:${i*.1}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),1500);
  });
}
function showWin(){
  document.getElementById('win-sc').textContent=score+' نقطة';
  document.getElementById('win-ov').style.display='flex';
}
function nextCat(){
  catIdx=(catIdx+1)%CATS.length;
  document.getElementById('win-ov').style.display='none';
  initCat();
}
window.addEventListener('resize',()=>renderGrid());
initCat();
</script>


<a href="../index.html" class="global-home-btn" style="position:fixed;top:15px;right:15px;background:rgba(0,0,0,0.5);color:#fff;text-decoration:none;font-family:sans-serif;font-weight:bold;padding:8px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);backdrop-filter:blur(10px);z-index:999999;display:flex;align-items:center;gap:8px;box-shadow:0 4px 15px rgba(0,0,0,0.3);transition:all 0.3s ease;">
  <span>🏠</span> عودة للرئيسية
</a>
<script>
  const btn = document.querySelector('.global-home-btn');
  btn.addEventListener('mouseover', () => { btn.style.background='rgba(255,255,255,0.1)'; btn.style.transform='translateY(-2px)'; });
  btn.addEventListener('mouseout', () => { btn.style.background='rgba(0,0,0,0.5)'; btn.style.transform='none'; });
</script>
</body>

</html>
