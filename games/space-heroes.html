<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 أبطال المجرة 3D - عالم الألعاب</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Fredoka One', cursive; background: #000; 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; user-select: none; }
    
    #back-btn {
      position: fixed; top: 18px; right: 18px;
      background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff; padding: 10px 22px; border-radius: 50px; font-size: 1rem;
      cursor: pointer; z-index: 100; backdrop-filter: blur(8px);
      text-decoration: none; transition: background 0.2s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.22); }

    #hud {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 14px; z-index: 10; font-size: 1.2rem; color: #fff;
    }
    .hud-chip {
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; padding: 8px 16px; backdrop-filter: blur(6px);
    }
    .hud-chip span { color: #00e5ff; }

    #renderer-wrap {
      border-radius: 20px; overflow: hidden;
      border: 3px solid rgba(0, 229, 255, 0.4);
      box-shadow: 0 0 60px rgba(0, 229, 255, 0.2);
    }

    #touch-controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 30px; z-index: 20;
    }
    .ctrl-btn {
      width: 85px; height: 85px; border-radius: 50%;
      background: rgba(0, 229, 255, 0.15); border: 2px solid rgba(0, 229, 255, 0.5);
      color: #fff; font-size: 2.2rem; display: flex; align-items: center;
      justify-content: center; cursor: pointer; backdrop-filter: blur(6px);
      transition: background 0.1s; -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active { background: rgba(0, 229, 255, 0.45); }

    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 50; gap: 16px; backdrop-filter: blur(8px);
    }
    #overlay h2 { font-size: 3rem; color: #00e5ff; }
    #overlay p { font-size: 1.25rem; color: rgba(255,255,255,0.85); text-align: center; line-height: 1.9; }
    #overlay button {
      background: linear-gradient(135deg, #00e5ff, #845ef7);
      color: #fff; border: none; padding: 15px 50px; font-size: 1.5rem;
      border-radius: 50px; cursor: pointer; font-family: 'Fredoka One', cursive;
      box-shadow: 0 8px 30px rgba(0, 229, 255, 0.4); transition: transform 0.2s;
    }
    #overlay button:hover { transform: scale(1.08); }
  </style>
</head>
<body>
  <a href="../index.html" id="back-btn">🏠 الرئيسية</a>
  
  <div id="hud">
    <div class="hud-chip">🚀 طاقة: <span id="score">0</span></div>
    <div class="hud-chip">❤️ أرواح: <span id="lives-display">❤️❤️❤️</span></div>
  </div>

  <div id="renderer-wrap">
    <div id="three-container"></div>
  </div>

  <div id="touch-controls">
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
  </div>

  <div id="overlay">
    <div style="font-size:5rem">🌌</div>
    <h2>أبطال المجرة!</h2>
    <p>
      ⌨️ استخدم <strong>أسهم الكيبورد</strong> أو الأزرار السفلية<br>
      🌀 التقط النجوم الكونية المضيئة!<br>
      💥 تجنب الكويكبات والصخور الفضائية!
    </p>
    <button id="start-btn">انطلق في الفضاء! 🚀</button>
  </div>

<script>
// ── أصوات ──
function snd(f) { try { const a=new Audio('../sounds/'+f); a.preload='auto'; return a; } catch(e){ return {play:()=>{},currentTime:0}; } }
const SFX = {
  start: snd('mixkit-arcade-rising-231.wav'),
  over:  snd('mixkit-long-game-over-notification-276.wav'),
  coin:  snd('mixkit-video-game-treasure-2066.wav'),
  crash: snd('mixkit-video-game-bomb-alert-2803.wav'),
};
function play(s){ try{ s.currentTime=0; s.play().catch(()=>{}); }catch(e){} }

const W = Math.min(window.innerWidth - 40, 700);
const H = Math.min(window.innerHeight - 150, 520);
document.getElementById('renderer-wrap').style.width  = W + 'px';
document.getElementById('renderer-wrap').style.height = H + 'px';

// ── Three.js ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.Fog(0x050510, 30, 100);

const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 150);
camera.position.set(0, 5, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
document.getElementById('three-container').appendChild(renderer.domElement);

// ── إضاءة ──
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// ── تصميم مركبة فضائية زجاجية ومضيئة ──
function createShip() {
  const group = new THREE.Group();
  
  // الجسم
  const bodyGeo = new THREE.ConeGeometry(1, 4, 8);
  bodyGeo.rotateX(Math.PI/2);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, metalness: 0.8, roughness: 0.2 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  group.add(body);
  
  // الأجنحة
  const wingGeo = new THREE.BoxGeometry(4, 0.2, 1.5);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0x845ef7, metalness: 0.5 });
  const wing = new THREE.Mesh(wingGeo, wingMat);
  wing.position.set(0, -0.2, 1);
  group.add(wing);

  // نيران الدفع
  const fireGeo = new THREE.ConeGeometry(0.5, 2, 8);
  fireGeo.rotateX(-Math.PI/2);
  const fireMat = new THREE.MeshBasicMaterial({ color: 0xff4757, transparent: true, opacity: 0.8 });
  const fire = new THREE.Mesh(fireGeo, fireMat);
  fire.position.set(0, 0, 2.5);
  group.add(fire);
  group.userData.fire = fire; // للمحرك

  group.scale.set(0.6, 0.6, 0.6);
  return group;
}

const player = createShip();
player.position.set(0, 0, 8);
scene.add(player);

// ── خلفية النجوم المندفعة (Warp effect) ──
const starsGeo = new THREE.BufferGeometry();
const starsCount = 500;
const starsPositions = new Float32Array(starsCount * 3);
for(let i=0; i<starsCount*3; i+=3) {
  starsPositions[i] = (Math.random() - 0.5) * 80;
  starsPositions[i+1] = (Math.random() - 0.5) * 40 + 10;
  starsPositions[i+2] = -Math.random() * 100;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 });
const particleSystem = new THREE.Points(starsGeo, starsMat);
scene.add(particleSystem);


// ── الطريق الوهمي (شبكة النيون) ──
const grid = new THREE.GridHelper(100, 40, 0x00e5ff, 0x845ef7);
grid.position.y = -2;
grid.material.opacity = 0.2;
grid.material.transparent = true;
scene.add(grid);

const LANES = [-3.5, 0, 3.5];
let score=0, lives=3, running=false;
let laneIdx=1, targetX = LANES[1];
let speed=30, spawnTimer=0, spawnCoinTimer=0;
let obstacles=[], coins=[];

// ── التحكم ──
document.getElementById('btn-left').addEventListener('mousedown', () => moveDir(-1));
document.getElementById('btn-right').addEventListener('mousedown', () => moveDir(1));
document.getElementById('btn-left').addEventListener('touchstart', (e) => { if(e.cancelable) e.preventDefault(); moveDir(-1); }, {passive:false});
document.getElementById('btn-right').addEventListener('touchstart', (e) => { if(e.cancelable) e.preventDefault(); moveDir(1); }, {passive:false});
document.addEventListener('keydown', e => {
  if(!running) return;
  if(e.key==='ArrowLeft' || e.key==='a') moveDir(-1);
  if(e.key==='ArrowRight' || e.key==='d') moveDir(1);
});

let touchSX = 0;
renderer.domElement.addEventListener('touchstart', e => { 
  const t = e.touches && e.touches.length > 0 ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : null);
  if(t) touchSX = t.clientX; 
}, {passive:true});
renderer.domElement.addEventListener('touchend', e => {
  const t = e.changedTouches && e.changedTouches.length > 0 ? e.changedTouches[0] : (e.touches ? e.touches[0] : null);
  if(!t) return;
  const dx = t.clientX - touchSX;
  if(dx < -40) moveDir(-1);
  if(dx >  40) moveDir(1);
}, {passive:true});

function moveDir(d) {
  laneIdx = Math.max(0, Math.min(2, laneIdx + d));
  targetX = LANES[laneIdx];
  // امالة سفينة الفضاء
  player.rotation.z = -d * 0.5;
  setTimeout(()=> { player.rotation.z = 0; }, 250);
}

// ── توليد ──
function spawnMeteor() {
  const geo = new THREE.DodecahedronGeometry(Math.random() * 0.8 + 0.8, 1);
  const mat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.9 });
  const meteor = new THREE.Mesh(geo, mat);
  
  meteor.position.set(LANES[Math.floor(Math.random()*3)], 0, -80);
  meteor.userData = { rvX: Math.random()*0.1, rvY: Math.random()*0.1 };
  scene.add(meteor);
  obstacles.push(meteor);
}

function spawnEnergyBlob() {
  const geo = new THREE.SphereGeometry(0.7, 16, 16);
  const mat = new THREE.MeshStandardMaterial({ color:0x00e5ff, emissive:0x00e5ff, emissiveIntensity:0.6 });
  const blob = new THREE.Mesh(geo, mat);
  blob.position.set(LANES[Math.floor(Math.random()*3)], 0, -80);
  scene.add(blob);
  coins.push(blob);
}

// ── التحديث والأنيمشن ──
let lastT=0, hitFlash=0;
function animate(ts=0) {
  requestAnimationFrame(animate);
  if(!running) { renderer.render(scene, camera); return; }

  const dt = Math.min((ts - lastT)/1000, 0.04); lastT=ts;

  speed = 30 + score / 5;
  
  // حركة السفينة يمين وشمال
  player.position.x += (targetX - player.position.x) * 0.15;
  
  // حركة نيران السفينة
  player.userData.fire.scale.y = 1 + Math.random()*0.5;

  // حركة النجوم للوراء
  const positions = particleSystem.geometry.attributes.position.array;
  for(let i=2; i<starsCount*3; i+=3) {
    positions[i] += speed * dt;
    if(positions[i] > 20) positions[i] -= 100;
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;
  grid.position.z += speed * dt;
  if(grid.position.z > 20) grid.position.z -= 10;

  // المولدات
  spawnTimer += dt;
  if(spawnTimer > Math.max(0.3, 0.8 - score/100)) { spawnTimer=0; spawnMeteor(); }
  spawnCoinTimer += dt;
  if(spawnCoinTimer > 1.2) { spawnCoinTimer=0; spawnEnergyBlob(); }

  // النيازك
  obstacles = obstacles.filter(o => {
    o.position.z += speed * dt;
    o.rotation.x += o.userData.rvX;
    o.rotation.y += o.userData.rvY;
    if(o.position.z > 16) { scene.remove(o); return false; }
    
    if (Math.abs(o.position.x - player.position.x) < 1.2 && 
        Math.abs(o.position.z - player.position.z) < 1.5) {
      scene.remove(o);
      hitFlash = 15;
      lives--;
      document.getElementById('lives-display').textContent = '❤️'.repeat(Math.max(0, lives));
      play(SFX.crash);
      if(lives <= 0) gameOver();
      return false;
    }
    return true;
  });

  // الطاقة/العملات
  coins = coins.filter(c => {
    c.position.z += speed * dt;
    c.rotation.y += dt * 4;
    c.scale.setScalar(1 + Math.sin(ts/200)*0.1);
    
    if(c.position.z > 16) { scene.remove(c); return false; }
    if (Math.abs(c.position.x - player.position.x) < 1.5 && 
        Math.abs(c.position.z - player.position.z) < 1.5) {
      scene.remove(c);
      score += 5;
      document.getElementById('score').textContent = score;
      play(SFX.coin);
      return false;
    }
    return true;
  });

  if (hitFlash > 0) {
    hitFlash--;
    player.children[0].material.color.setHex(hitFlash%2===0 ? 0xff4757 : 0x00e5ff);
  } else {
    player.children[0].material.color.setHex(0x00e5ff);
  }

  renderer.render(scene, camera);
}

function gameOver() {
  running = false;
  play(SFX.over);
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <div style="font-size:4rem">💥</div>
    <h2 style="color:#ff4757">تدمرت السفينة!</h2>
    <p>لقد جمعت טاقة فضائية:<br><strong style="color:#00e5ff;font-size:2.8rem">${score}</strong></p>
    <button id="start-btn">رحلة جديدة! 🚀</button>
  `;
  ov.style.display = 'flex';
  document.getElementById('start-btn').addEventListener('click', startGame);
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  play(SFX.start);
  score = 0; lives = 3; laneIdx = 1; targetX = LANES[1];
  player.position.x = 0; hitFlash = 0;
  obstacles.forEach(o => scene.remove(o)); obstacles = [];
  coins.forEach(c => scene.remove(c));     coins = [];
  document.getElementById('score').textContent = 0;
  document.getElementById('lives-display').textContent = '❤️❤️❤️';
  running = true;
}

document.getElementById('start-btn').addEventListener('click', startGame);
requestAnimationFrame(animate);
</script>
</body>
</html>
