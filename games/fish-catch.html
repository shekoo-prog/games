<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎣 صائد الأسماك - عالم الألعاب</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Fredoka One', cursive; background: #001a2e;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; user-select: none; }

    #back-btn {
      position: fixed; top: 16px; right: 16px;
      background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.3);
      color: #fff; padding: 8px 18px; border-radius: 50px; font-size: 0.95rem;
      cursor: pointer; z-index: 100; backdrop-filter: blur(8px);
      text-decoration: none; transition: background 0.2s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.22); }

    #hud {
      display: flex; gap: 10px; margin-bottom: 8px; z-index: 5;
      font-size: 1.1rem; color: #fff; flex-wrap: wrap; justify-content: center;
    }
    .chip {
      background: rgba(0,40,80,0.7); border: 1px solid rgba(100,200,255,0.35);
      border-radius: 14px; padding: 5px 14px; backdrop-filter: blur(6px);
    }
    .chip span { color: #4df0ff; }

    canvas { display: block; border-radius: 18px; cursor: crosshair;
      box-shadow: 0 0 60px rgba(0,150,255,0.3); border: 2px solid rgba(0,150,255,0.3); }

    /* زر الرمي */
    #cast-btn {
      margin-top: 10px;
      background: linear-gradient(135deg, #1e90ff, #00bfff);
      color: #fff; border: none; padding: 12px 40px; font-size: 1.4rem;
      border-radius: 50px; cursor: pointer; font-family: 'Fredoka One', cursive;
      box-shadow: 0 6px 25px rgba(30,144,255,0.5); transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    #cast-btn:active { transform: scale(0.95); }

    #overlay {
      position: fixed; inset: 0; background: rgba(0,10,25,0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 50; gap: 14px; backdrop-filter: blur(8px);
    }
    #overlay h2 { font-size: 2.8rem; color: #4df0ff; text-shadow: 0 0 20px #4df0ff; }
    #overlay p { font-size: 1.1rem; color: rgba(255,255,255,0.85); text-align: center; line-height: 1.8; max-width: 380px; }
    #overlay button {
      background: linear-gradient(135deg, #1e90ff, #00bfff);
      color: #fff; border: none; padding: 13px 45px; font-size: 1.35rem;
      border-radius: 50px; cursor: pointer; font-family: 'Fredoka One', cursive;
      box-shadow: 0 8px 30px rgba(30,144,255,0.5); transition: transform 0.2s;
    }
    #overlay button:hover { transform: scale(1.07); }

    @media (max-width: 480px) {
      #back-btn { top:8px; right:8px; padding:5px 12px; font-size:0.8rem; }
      #hud { gap:5px; margin-bottom:5px; font-size:0.8rem; }
      .chip { padding:3px 9px; border-radius:10px; }
      #cast-btn { padding:10px 28px; font-size:1.15rem; margin-top:7px; }
      #overlay h2 { font-size:1.8rem; }
      #overlay p  { font-size:0.9rem; }
      #overlay button { padding:10px 28px; font-size:1.1rem; }
    }
  </style>
</head>
<body>
  <a href="../index.html" id="back-btn">🏠 الرئيسية</a>

  <div id="hud">
    <div class="chip">🏆 نقاط: <span id="score">0</span></div>
    <div class="chip">❤️ أرواح: <span id="lives-el">❤️❤️❤️</span></div>
    <div class="chip">🐟 اصطدت: <span id="fish-count">0</span></div>
    <div class="chip">🎯 مستوى: <span id="level-el">1</span></div>
  </div>

  <canvas id="canvas"></canvas>
  <button id="cast-btn">🎣 رمي / سحب</button>

  <div id="overlay">
    <div style="font-size:5rem">🎣</div>
    <h2>صائد الأسماك!</h2>
    <p>
      🖱️ <strong>حرّك</strong> الماوس / إصبعك لتوجيه السنارة<br>
      👇 <strong>اضغط</strong> على الزر أو الشاشة للرمي والسحب<br>
      🐠 اصطد أسماك ملونة متنوعة وجمع النقاط! 🌟<br>
      🦈 احذر القرش والأخطبوط والجليد!
    </p>
    <button id="start-btn">ابدأ الصيد! 🎣</button>
  </div>

<script>
'use strict';

// ── إعداد الـ Canvas ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const W = Math.min(window.innerWidth - 20, 680);
const H = Math.min(window.innerHeight - 180, 500);
canvas.width = W; canvas.height = H;

// ── أصوات ──
function beep(freq = 440, dur = 0.08, type = 'sine', vol = 0.3) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ac.createOscillator(); const g = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.start(); osc.stop(ac.currentTime + dur);
  } catch(e) {}
}
const SFX = {
  catch: () => { beep(600,0.12,'sine',0.4); setTimeout(()=>beep(900,0.1,'sine',0.3),120); },
  miss:  () => beep(180, 0.25, 'sawtooth', 0.3),
  levelUp: () => { [500,700,900].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'sine',0.4),i*120)); },
  danger: () => beep(200, 0.35, 'square', 0.2),
};

// ── متغيرات اللعبة ──
let score = 0, lives = 3, fishCaught = 0, level = 1, running = false;
let mouseX = W / 2;
let hookX = W / 2, hookY = 55;  // موضع الخطاف
let hookState = 'swing';  // swing | drop | reel
let hookSpeed = 5;
let reelTarget = null;    // سمكة مخطوفة
let swingAngle = 0, swingDir = 1;
const POLE_X = W / 2, POLE_Y = 8;
const HOOK_RADIUS = 12;

// ── الأسماك والعوائق ──
const FISH_TYPES = [
  { name: 'قاروص',   emoji: '🐟', color: '#4dd0e1', pts: 10,  size: 28, speed: 1.2, weight: 0.9 },
  { name: 'سمك ذهبي',emoji: '🐠', color: '#ff8c00', pts: 20,  size: 24, speed: 1.5, weight: 1.0 },
  { name: 'سمكة الببغاء', emoji: '🦜', color: '#00e676', pts: 30, size: 26, speed: 1.8, weight: 0.8 },
  { name: 'سمك النجمة',   emoji: '⭐', color: '#ffd600', pts: 50, size: 22, speed: 2.2, weight: 0.7 },
  { name: 'سمك الكرة',    emoji: '🐡', color: '#f06292', pts: 25, size: 30, speed: 1.0, weight: 1.1 },
  { name: 'سمك المنتفخ',  emoji: '🦑', color: '#ab47bc', pts: 35, size: 32, speed: 1.3, weight: 1.2, bad: false },
];
const DANGER_TYPES = [
  { name: 'قرش',  emoji: '🦈', color: '#546e7a', pts: -1, size: 42, speed: 2.5 },
  { name: 'أخطبوط', emoji: '🐙', color: '#8d6e63', pts: -1, size: 36, speed: 1.6 },
  { name: 'ميديوزا', emoji: '🪼', color: '#80deea', pts: -1, size: 30, speed: 1.0 },
];

let fishes = [], particles = [], floatTexts = [], bubbles = [];
let spawnTimer = 0;

// ── رسم الخلفية (بحر) ──
function drawBackground() {
  // سماء/ماء تدرج
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.22);
  skyGrad.addColorStop(0, '#001a2e');
  skyGrad.addColorStop(1, '#00334d');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.22);

  // سطح الماء
  const waterGrad = ctx.createLinearGradient(0, H * 0.22, 0, H);
  waterGrad.addColorStop(0, '#004973');
  waterGrad.addColorStop(0.4, '#003a5c');
  waterGrad.addColorStop(1, '#001830');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, H * 0.22, W, H);

  // خط سطح الماء مموج
  ctx.strokeStyle = 'rgba(100,210,255,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const waveY = H * 0.22;
  ctx.moveTo(0, waveY);
  for (let x = 0; x < W; x += 4) {
    ctx.lineTo(x, waveY + Math.sin((x / 40) + Date.now() / 800) * 4);
  }
  ctx.stroke();

  // شعاع الشمس
  ctx.fillStyle = 'rgba(255,230,100,0.07)';
  for (let i = 0; i < 5; i++) {
    ctx.save(); ctx.translate(W * 0.3, 0);
    ctx.rotate((-0.5 + i * 0.12) + Math.sin(Date.now() / 3000) * 0.03);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-30, H); ctx.lineTo(30, H); ctx.fill();
    ctx.restore();
  }

  // فقاعات
  bubbles.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(100,210,255,${b.op})`; ctx.lineWidth = 1; ctx.stroke();
  });

  // ضوء الهدف (تحت الماء)
  const lg = ctx.createRadialGradient(hookX, hookY, 0, hookX, hookY, 80);
  lg.addColorStop(0, 'rgba(100, 220, 255, 0.12)');
  lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, H * 0.22, W, H);

  // قاع البحر
  ctx.fillStyle = '#001020';
  ctx.fillRect(0, H - 40, W, 40);
  // رمال القاع
  ctx.fillStyle = '#0d2233';
  ctx.beginPath();
  ctx.ellipse(W * 0.2, H - 30, 80, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(W * 0.7, H - 28, 100, 22, 0, 0, Math.PI * 2);
  ctx.fill();
  // مرجان
  drawCoral(W * 0.1, H - 40, '#ff4444');
  drawCoral(W * 0.35, H - 42, '#ff8800');
  drawCoral(W * 0.6, H - 38, '#ff44aa');
  drawCoral(W * 0.85, H - 44, '#44aaff');
}

function drawCoral(x, y, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - 12); ctx.lineTo(x - 12, y - 22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - 12); ctx.lineTo(x + 12, y - 22); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y - 26, 5, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
}

// ── رسم العصا والخيط ──
function drawRod() {
  // عصا الصيد
  ctx.save();
  ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.shadowColor = '#3e2723'; ctx.shadowBlur = 4;
  ctx.beginPath(); ctx.moveTo(W / 2 - 20, 4); ctx.lineTo(POLE_X + 18, POLE_Y + 12); ctx.stroke();
  ctx.restore();

  // الخيط من طرف العصا للخطاف
  const lineX = POLE_X + 18, lineY = POLE_Y + 12;
  ctx.save();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(200,240,255,0.75)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(lineX, lineY); ctx.lineTo(hookX, hookY); ctx.stroke();
  ctx.restore();
}

// ── رسم الخطاف ──
function drawHook() {
  ctx.save();
  const grad = ctx.createRadialGradient(hookX, hookY, 0, hookX, hookY, HOOK_RADIUS);
  grad.addColorStop(0, 'rgba(200,240,255,0.25)');
  grad.addColorStop(1, 'rgba(200,240,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(hookX, hookY, HOOK_RADIUS + 8, 0, Math.PI * 2); ctx.fill();

  // خطاف معدني
  ctx.strokeStyle = '#cdd9e5'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hookX, hookY - 10);
  ctx.lineTo(hookX, hookY + 8);
  ctx.arc(hookX - 4, hookY + 8, 4, 0, Math.PI, false);
  ctx.lineTo(hookX - 8, hookY + 4);
  ctx.stroke();
  ctx.restore();
}

// ── رسم سمكة ──
function drawFish(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  // الاتجاه
  if (f.vx < 0) ctx.scale(-1, 1);

  const sz = f.size;
  // ظل
  ctx.shadowColor = f.bad ? '#ff1744' : f.color;
  ctx.shadowBlur = 12;
  // جسم السمكة
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, sz, sz * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  // ذيل
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.moveTo(sz * 0.8, 0);
  ctx.lineTo(sz * 1.4, -sz * 0.5);
  ctx.lineTo(sz * 1.4, sz * 0.5);
  ctx.closePath(); ctx.fill();
  // بطن أفتح
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(-sz * 0.1, sz * 0.2, sz * 0.55, sz * 0.28, 0.2, 0, Math.PI * 2); ctx.fill();
  // عين
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-sz * 0.4, -sz * 0.12, sz * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a237e';
  ctx.beginPath(); ctx.arc(-sz * 0.4, -sz * 0.12, sz * 0.1, 0, Math.PI * 2); ctx.fill();
  // زعنفة
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.moveTo(-sz * 0.2, -sz * 0.4); ctx.lineTo(sz * 0.2, -sz * 0.4); ctx.lineTo(0, 0); ctx.fill();

  // تألق للسمك الخاص
  if (f.pts >= 50) {
    ctx.strokeStyle = 'rgba(255,230,0,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, sz + 6, 0, Math.PI * 2); ctx.stroke();
  }
  if (f.bad) {
    // علامة تحذير للأخطار
    ctx.fillStyle = '#ff1744'; ctx.font = `bold ${sz * 0.7}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, 0);
  }
  ctx.restore();
}

// ── توليد الأسماك ──
function spawnFish() {
  const fromRight = Math.random() > 0.5;
  const depth = H * 0.28 + Math.random() * (H * 0.6);

  // احتمال توليد خطر بناءً على المستوى
  const dangerChance = Math.min(0.12 + level * 0.04, 0.35);
  let type;
  if (Math.random() < dangerChance) {
    type = { ...DANGER_TYPES[Math.floor(Math.random() * DANGER_TYPES.length)], bad: true };
  } else {
    const fi = FISH_TYPES[Math.floor(Math.random() * FISH_TYPES.length)];
    type = { ...fi, bad: false };
  }

  const speed = (type.speed + level * 0.15) * (0.8 + Math.random() * 0.4);
  fishes.push({
    ...type,
    x: fromRight ? W + type.size : -type.size,
    y: depth,
    vx: fromRight ? -speed : speed,
    vy: (Math.random() - 0.5) * 0.5,
    wobble: Math.random() * Math.PI * 2,
    caught: false, reeling: false
  });
}

// ── البيانات النصية العائمة ──
function addFloatText(x, y, text, color = '#ffd93d') {
  floatTexts.push({ x, y, text, color, life: 70, vy: -1.5 });
}

// ── الفقاعات ──
function spawnBubble() {
  bubbles.push({
    x: Math.random() * W,
    y: H - Math.random() * 50,
    r: 2 + Math.random() * 5,
    vy: -(0.3 + Math.random() * 0.6),
    op: 0.3 + Math.random() * 0.5
  });
}

// ── التحكم ──
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = Math.max(20, Math.min(W - 20, (e.clientX - r.left) * (W / r.width)));
});
canvas.addEventListener('touchmove', e => {
  if (e.cancelable) e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const cx = e.touches[0].clientX;
  mouseX = Math.max(20, Math.min(W - 20, (cx - r.left) * (W / r.width)));
}, { passive: false });

function cast() {
  if (!running) return;
  if (hookState === 'swing') {
    hookState = 'drop';
    beep(440, 0.1, 'sine', 0.25);
  } else if (hookState === 'drop' || hookState === 'reel') {
    hookState = 'reel';
  }
}
canvas.addEventListener('click', cast);
canvas.addEventListener('touchstart', e => { if (e.cancelable) e.preventDefault(); cast(); }, { passive: false });
document.getElementById('cast-btn').addEventListener('click', cast);

// ── حلقة التحديث ──
let lastTime = 0;
function update(ts) {
  if (!running) return;
  const dt = Math.min((ts - lastTime) / 1000, 0.05); lastTime = ts;

  // فقاعات
  if (Math.random() < 0.04) spawnBubble();
  bubbles = bubbles.filter(b => { b.y += b.vy; b.op -= 0.003; return b.op > 0 && b.y > 0; });

  // توليد أسماك
  spawnTimer += dt;
  const spawnInterval = Math.max(0.4, 1.8 - level * 0.12);
  if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnFish(); }

  // خطاف
  const WATER_TOP = H * 0.22;
  if (hookState === 'swing') {
    swingAngle += 0.035 * swingDir;
    if (swingAngle > 1.1) swingDir = -1;
    if (swingAngle < -1.1) swingDir = 1;
    // تحريك الخطاف لموضع الماوس بسلاسة
    const targetX = POLE_X + mouseX - W / 2;
    hookX += (targetX - hookX) * 0.12;
    hookX = Math.max(20, Math.min(W - 20, hookX));
    hookY = WATER_TOP - 18;
  } else if (hookState === 'drop') {
    hookY += hookSpeed + level * 0.5;
    if (hookY >= H - 30) { hookState = 'reel'; }
  } else if (hookState === 'reel') {
    hookY -= (hookSpeed + level * 0.4) * 1.3;
    if (reelTarget) {
      reelTarget.x = hookX;
      reelTarget.y = hookY;
    }
    if (hookY <= WATER_TOP - 5) {
      if (reelTarget) {
        // اصطدنا سمكة!
        score += reelTarget.pts;
        fishCaught++;
        document.getElementById('score').textContent = score;
        document.getElementById('fish-count').textContent = fishCaught;
        addFloatText(hookX, WATER_TOP, `+${reelTarget.pts} ${reelTarget.name}!`, '#ffd93d');
        SFX.catch();
        // جزيئات احتفالية
        for (let i = 0; i < 12; i++) {
          particles.push({
            x: hookX, y: WATER_TOP,
            vx: (Math.random() - 0.5) * 5,
            vy: -3 - Math.random() * 3,
            color: reelTarget.color,
            life: 50
          });
        }
        // مستوى جديد
        if (fishCaught % 6 === 0) {
          level++;
          document.getElementById('level-el').textContent = level;
          addFloatText(W / 2, H / 2, `🎉 مستوى ${level}!`, '#00e5ff');
          SFX.levelUp();
        }
        fishes = fishes.filter(f => f !== reelTarget);
        reelTarget = null;
      }
      hookState = 'swing';
      hookX = W / 2;
    }
  }

  // حركة الأسماك
  fishes.forEach(f => {
    f.wobble += 0.07;
    f.x += f.vx;
    f.y += f.vy + Math.sin(f.wobble) * 0.5;
    f.y = Math.max(H * 0.26, Math.min(H - 45, f.y));

    // تصادم الخطاف بالسمكة
    if (hookState === 'drop' || hookState === 'reel') {
      const dx = hookX - f.x, dy = hookY - f.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < HOOK_RADIUS + f.size * 0.7 && !f.caught && !reelTarget) {
        if (f.bad) {
          // خطر!
          lives--;
          document.getElementById('lives-el').textContent = '❤️'.repeat(Math.max(0, lives));
          addFloatText(hookX, hookY, `💀 ${f.name}!`, '#ff1744');
          SFX.danger();
          fishes = fishes.filter(x => x !== f);
          hookState = 'reel'; reelTarget = null;
          if (lives <= 0) gameOver();
        } else {
          f.caught = true;
          reelTarget = f;
          hookState = 'reel';
          beep(700, 0.08, 'sine', 0.3);
        }
      }
    }
  });

  // إزالة الأسماك خارج الشاشة
  fishes = fishes.filter(f => f.x > -100 && f.x < W + 100);

  // جسيمات
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
    return p.life > 0;
  });

  // نصوص عائمة
  floatTexts = floatTexts.filter(t => {
    t.y += t.vy; t.life--;
    return t.life > 0;
  });
}

// ── رسم ──
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  // الأسماك
  fishes.forEach(drawFish);

  // جسيمات
  particles.forEach(p => {
    const alpha = p.life / 50;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = p.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
    ctx.fill();
  });

  drawRod();
  drawHook();

  // نصوص عائمة
  floatTexts.forEach(t => {
    const alpha = t.life / 70;
    ctx.font = `bold ${Math.min(22, W * 0.04)}px Fredoka One, sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = t.color;
    ctx.globalAlpha = alpha;
    ctx.shadowColor = t.color; ctx.shadowBlur = 10;
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  });
}

// ── الحلقة الرئيسية ──
function loop(ts) {
  update(ts);
  draw();
  if (running) requestAnimationFrame(loop);
}

// ── نهاية اللعبة ──
function gameOver() {
  running = false;
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <div style="font-size:4.5rem">🎣</div>
    <h2 style="color:#ff6b6b">انتهت الجولة!</h2>
    <p>
      اصطدت <strong style="color:#4df0ff;font-size:1.5rem">${fishCaught}</strong> سمكة<br>
      نقاطك: <strong style="color:#ffd93d;font-size:2rem">${score}</strong><br>
      وصلت لمستوى <strong style="color:#69f0ae">${level}</strong>
    </p>
    <button id="start-btn" style="background:linear-gradient(135deg,#1e90ff,#00bfff)">🎣 العب مجدداً!</button>
  `;
  ov.style.display = 'flex';
  document.getElementById('start-btn').addEventListener('click', startGame);
}

// ── بدء اللعبة ──
function startGame() {
  document.getElementById('overlay').style.display = 'none';
  score = 0; lives = 3; fishCaught = 0; level = 1;
  fishes = []; particles = []; floatTexts = []; bubbles = [];
  hookX = W / 2; hookY = H * 0.22 - 18; hookState = 'swing';
  reelTarget = null; spawnTimer = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('lives-el').textContent = '❤️❤️❤️';
  document.getElementById('fish-count').textContent = 0;
  document.getElementById('level-el').textContent = 1;
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click', startGame);

// رسم أولي
draw();
</script>
</body>
</html>
