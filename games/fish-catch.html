<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎣 صائد الأسماك - عالم الألعاب</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Fredoka One', cursive; background: #004d80; 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; user-select: none; }
    
    #back-btn {
      position: fixed; top: 18px; right: 18px;
      background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.3);
      color: #fff; padding: 10px 22px; border-radius: 50px; font-size: 1rem;
      cursor: pointer; z-index: 100; backdrop-filter: blur(8px);
      text-decoration: none; transition: background 0.2s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.22); }

    #hud {
      display: flex; gap: 14px; margin-bottom: 10px; z-index: 5;
      font-size: 1.2rem; color: #fff; flex-wrap: wrap; justify-content: center;
    }
    .chip {
      background: rgba(0,0,0,0.5); border: 1px solid rgba(135,206,235,0.4);
      border-radius: 14px; padding: 6px 16px; backdrop-filter: blur(6px);
    }
    .chip span { color: #87ceeb; }

    canvas {
      border: 3px solid #1c3d5a;
      border-radius: 16px;
      background: linear-gradient(to bottom, #87ceeb, #004d80, #001a33);
      box-shadow: 0 0 60px rgba(0, 77, 128, 0.4);
      display: block;
      cursor: crosshair;
    }

    #overlay {
      position: fixed; inset: 0; background: rgba(0, 26, 51, 0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 50; gap: 16px; backdrop-filter: blur(8px);
    }
    #overlay h2 { font-size: 3rem; color: #87ceeb; }
    #overlay p { font-size: 1.2rem; color: rgba(255,255,255,0.85); text-align: center; line-height: 1.8; }
    #overlay button {
      background: linear-gradient(135deg, #1e90ff, #00bfff);
      color: #001a33; border: none; padding: 15px 50px; font-size: 1.5rem;
      border-radius: 50px; cursor: pointer; font-family: 'Fredoka One', cursive;
      box-shadow: 0 8px 30px rgba(30, 144, 255, 0.4); transition: transform 0.2s;
    }
    #overlay button:hover { transform: scale(1.08); }
    
    /* أمواج للزينة */
    .waves {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1000 100" xmlns="http://www.w3.org/2000/svg"><path d="M0,50 Q250,100 500,50 T1000,50 v50 H0 z" fill="%23004d80" opacity="0.3"/></svg>') repeat-x;
      background-size: 1000px 100px; animation: waveAnim 10s linear infinite; pointer-events: none; z-index: 10;
    }
    @keyframes waveAnim { from { background-position: 0 0; } to { background-position: 1000px 0; } }
  </style>
</head>
<body>
  <a href="../index.html" id="back-btn">🏠 الرئيسية</a>

  <div id="hud">
    <div class="chip">🏆 نقاط: <span id="score">0</span></div>
    <div class="chip">❤️ أرواح: <span id="lives-el">❤️❤️❤️</span></div>
    <div class="chip">🐟 أسماك: <span id="fish-count">0</span></div>
  </div>

  <canvas id="canvas"></canvas>
  <div class="waves"></div>

  <div id="overlay">
    <div style="font-size:5rem">🎣</div>
    <h2>صائد الأسماك!</h2>
    <p>
      🖱️ <strong>حرّك الماوس/أصبعك</strong> لتحريك السنارة<br>
      👇 <strong>اضغط</strong> لتنزيل الخطاف<br>
      🐡 التقط الأسماك وتجنب القرش 🦈 وقنديل البحر 🦑!
    </p>
    <button id="start-btn">ابدأ الصيد! 🎣</button>
  </div>

<script>
// ── أصوات ──
function snd(f) { try { const a=new Audio('../sounds/'+f); a.preload='auto'; return a; } catch(e){ return {play:()=>{},currentTime:0}; } }
const SFX = {
  start:   snd('mixkit-medieval-show-fanfare-announcement-226.wav'),
  drop:    snd('mixkit-retro-video-game-bubble-laser-277.wav'),
  catch:   snd('mixkit-video-game-treasure-2066.wav'),
  shark:   snd('mixkit-video-game-bomb-alert-2803.wav'),
  over:    snd('mixkit-long-game-over-notification-276.wav')
};
function play(s){ try{ s.currentTime=0; s.play().catch(()=>{}); }catch(e){} }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width = Math.min(window.innerWidth - 30, 680);
const H = canvas.height = Math.min(window.innerHeight - 150, 480);

let running = false, animId;
let score = 0, lives = 3, fishesCaught = 0;
let fishes = [];
let floatTexts = [];
let bubbles = [];

// ── حالة الخطاف والتفاعل ──
let boatX = W/2, mouseX = W/2;
let hook = { state: 'idle', y: 40, grabbedFish: null };
// idle, drop, reel

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('touchmove', e => {
  if(e.cancelable) e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : (e.changedTouches ? e.changedTouches[0].clientX : 0);
  mouseX = (clientX - rect.left) * (W / rect.width);
}, { passive: false });

function dropHook() {
  if (!running || hook.state !== 'idle') return;
  hook.state = 'drop';
  play(SFX.drop);
}
canvas.addEventListener('mousedown', dropHook);
canvas.addEventListener('touchstart', e => { if(e.cancelable) e.preventDefault(); dropHook(); }, { passive: false });

document.addEventListener('keydown', e => {
  if(!running) return;
  if (e.code === 'Space' || e.code === 'ArrowDown') { e.preventDefault(); dropHook(); }
  if (e.code === 'ArrowLeft') mouseX -= 20;
  if (e.code === 'ArrowRight') mouseX += 20;
});

function init() {
  score = 0; lives = 3; fishesCaught = 0;
  document.getElementById('score').textContent = score;
  document.getElementById('lives-el').textContent = '❤️'.repeat(3);
  document.getElementById('fish-count').textContent = 0;
  boatX = W/2; mouseX = W/2;
  hook = { state: 'idle', y: 40, grabbedFish: null };
  fishes = []; floatTexts = []; bubbles = [];
  
  // توليد الأسماك
  for (let i = 0; i < 8; i++) spawnFish();
  for (let i = 0; i < 3; i++) spawnFish('🦈');
  for (let i = 0; i < 2; i++) spawnFish('🦑');
}

function spawnFish(specificType = null) {
  const types = [
    { emoji: '🐠', pts: 15, spd: 2.5, size: 30 },
    { emoji: '🐟', pts: 10, spd: 1.5, size: 35 },
    { emoji: '🐡', pts: 20, spd: 3.0, size: 28 },
    { emoji: '🦐', pts: 5,  spd: 0.8, size: 22 }
  ];
  
  let type;
  if (specificType === '🦈') type = { emoji: '🦈', pts: -1, spd: 3.5, size: 50, bad: true };
  else if (specificType === '🦑') type = { emoji: '🦑', pts: -1, spd: 1.0, size: 40, bad: true };
  else type = types[Math.floor(Math.random() * types.length)];
  
  const fromLeft = Math.random() > 0.5;
  const x = fromLeft ? -50 : W + 50;
  const y = 140 + Math.random() * (H - 200);
  const vx = (fromLeft ? 1 : -1) * (type.spd + Math.random());
  
  fishes.push({ ...type, x, y, vx, dir: fromLeft ? 1 : -1 });
}

function update(dt) {
  // للجمالية فقاعات
  if (Math.random() < 0.05) {
    bubbles.push({ x: Math.random()*W, y: H, r: 2+Math.random()*4, vy: -1-Math.random()*2 });
  }

  // القارب والخطاف
  if (hook.state === 'idle') {
    boatX += (mouseX - boatX) * 0.1;
    boatX = Math.max(20, Math.min(W-20, boatX));
  } else if (hook.state === 'drop') {
    hook.y += 8;
    if (hook.y > H) {
      hook.state = 'reel';
    }
    // فحص التصادم
    for (let i = 0; i < fishes.length; i++) {
      const f = fishes[i];
      const dx = boatX - f.x;
      const dy = hook.y - f.y;
      if (Math.hypot(dx, dy) < f.size/2 + 10) {
        hook.state = 'reel';
        hook.grabbedFish = f;
        fishes.splice(i, 1);
        if(f.bad) { 
          play(SFX.shark); 
          lives--; 
          document.getElementById('lives-el').textContent = '❤️'.repeat(Math.max(0, lives));
          if(lives<=0) endGame();
        } else {
          play(SFX.catch);
        }
        break;
      }
    }
  } else if (hook.state === 'reel') {
    hook.y -= 6 + (hook.grabbedFish && hook.grabbedFish.bad ? -3 : 0); // القرش أثقل
    if (hook.y <= 40) {
      if (hook.grabbedFish) {
        if (!hook.grabbedFish.bad) {
          score += hook.grabbedFish.pts;
          fishesCaught++;
          document.getElementById('score').textContent = score;
          document.getElementById('fish-count').textContent = fishesCaught;
          addFloatText(boatX, 60, '+' + hook.grabbedFish.pts, '#ffd93d');
        } else {
          addFloatText(boatX, 60, 'أوتش!', '#ff4d4d');
        }
        // تعويض السمكة
        spawnFish(hook.grabbedFish.emoji === '🦈' ? '🦈' : hook.grabbedFish.emoji === '🦑' ? '🦑' : null);
        hook.grabbedFish = null;
      }
      hook.state = 'idle';
      hook.y = 40;
    }
  }

  // حركة الأسماك
  fishes.forEach(f => {
    f.x += f.vx;
    f.y += Math.sin(f.x / 50) * 0.5; // حركة موجية خفيفة
    if (f.x > W + 80 || f.x < -80) {
      f.dir = f.x > W ? -1 : 1;
      f.vx = Math.abs(f.vx) * f.dir;
      f.y = 140 + Math.random() * (H - 200);
    }
  });

  // حركة الفقاعات
  bubbles.forEach(b => {
    b.y += b.vy;
    b.x += Math.sin(b.y / 20) * 1;
  });
  bubbles = bubbles.filter(b => b.y > -20);
  
  floatTexts.forEach(ft => ft.life--);
  floatTexts = floatTexts.filter(ft => ft.life > 0);
}

function addFloatText(x, y, text, col) {
  floatTexts.push({ x, y, text, life: 50, col });
}

function draw() {
  ctx.clearRect(0,0,W,H);
  
  // فقاعات
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  bubbles.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
  });

  // القارب (نصف دائرة بسيطة كأنها قارب)
  ctx.save();
  ctx.fillStyle = '#8b4513';
  ctx.beginPath();
  ctx.arc(boatX, 10, 30, 0, Math.PI, false);
  ctx.fill();
  // إيموجي صياد أو قارب
  ctx.font = '24px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⛵', boatX, 20);
  ctx.restore();

  // الخيط
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(boatX, 30);
  ctx.lineTo(boatX, hook.y);
  ctx.stroke();

  // الخطاف
  ctx.save();
  ctx.translate(boatX, hook.y);
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 8, 8, Math.PI, 0, true);
  ctx.stroke();
  ctx.restore();

  // الأسماك
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fishes.forEach(f => {
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.dir === -1) ctx.scale(-1, 1); // عكس السمكة
    ctx.font = f.size + 'px serif';
    ctx.fillText(f.emoji, 0, 0);
    ctx.restore();
  });

  // السمكة الممسوكة
  if (hook.grabbedFish) {
    ctx.save();
    ctx.translate(boatX, hook.y + 15);
    ctx.rotate(Math.PI/2); // السمكة معلقة طولياً
    ctx.font = hook.grabbedFish.size + 'px serif';
    ctx.fillText(hook.grabbedFish.emoji, 0, 0);
    ctx.restore();
  }

  // النصوص الطائرة
  floatTexts.forEach(ft => {
    ctx.save();
    ctx.globalAlpha = ft.life / 50;
    ctx.font = 'bold 24px Fredoka One, cursive';
    ctx.fillStyle = ft.col;
    ctx.textAlign = 'center';
    ctx.shadowBlur = 4; ctx.shadowColor = '#000';
    ctx.fillText(ft.text, ft.x, ft.y - (50 - ft.life));
    ctx.restore();
  });
}

function gameLoop() {
  if (!running) return;
  update(); draw();
  animId = requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  play(SFX.start);
  init();
  running = true;
  gameLoop();
}

function endGame() {
  running = false;
  cancelAnimationFrame(animId);
  play(SFX.over);
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <div style="font-size:5rem">🦈</div>
    <h2 style="color:#ff6b6b">أكلك القرش!</h2>
    <p>لقد جمعت:<br>
    <strong style="color:#ffd93d;font-size:2.8rem">${score} نقطة</strong><br>
    وصطدت <strong style="color:#87ceeb">${fishesCaught}</strong> 🐟</p>
    <button id="start-btn">العب مجدداً! 🎣</button>
  `;
  ov.style.display = 'flex';
  document.getElementById('start-btn').addEventListener('click', startGame);
}

document.getElementById('start-btn').addEventListener('click', startGame);
</script>
</body>
</html>
