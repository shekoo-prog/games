<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 Space Shooter - عالم الألعاب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000814;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      font-family: 'Fredoka One', cursive;
      overflow: hidden; user-select: none;
    }
    #back-btn {
      position: fixed; top: 18px; right: 18px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff; padding: 10px 22px;
      border-radius: 50px; font-size: 1rem;
      cursor: pointer; z-index: 100;
      font-family: 'Fredoka One', cursive;
      backdrop-filter: blur(8px);
      text-decoration: none;
      transition: background 0.2s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.22); }

    #hud {
      display: flex; gap: 30px; align-items: center;
      margin-bottom: 12px; z-index: 10;
      font-size: 1.4rem; color: #fff;
    }
    #hud span { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 6px 20px; }
    .label { color: #ffd93d; }

    canvas {
      border: 2px solid rgba(77,150,255,0.5);
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(77,150,255,0.3), 0 0 80px rgba(77,150,255,0.15);
      display: block;
      background: #000814;
    }
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,8,20,0.9);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 50; gap: 20px;
      backdrop-filter: blur(6px);
    }
    #overlay h2 { font-size: 3rem; color: #ffd93d; text-shadow: 0 0 30px #ffd93d; }
    #overlay p  { font-size: 1.3rem; color: rgba(255,255,255,0.8); text-align: center; line-height: 1.8; }
    #overlay button {
      background: linear-gradient(135deg, #4d96ff, #845ef7);
      color: #fff; border: none;
      padding: 16px 50px; font-size: 1.5rem;
      border-radius: 50px; cursor: pointer;
      font-family: 'Fredoka One', cursive;
      box-shadow: 0 8px 30px rgba(77,150,255,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #overlay button:hover { transform: scale(1.08); box-shadow: 0 12px 40px rgba(77,150,255,0.7); }
    #lives-hearts { font-size: 1.4rem; letter-spacing: 6px; }
  </style>
</head>
<body>
  <a href="../index.html" id="back-btn">🏠 الرئيسية</a>

  <div id="overlay">
    <div style="font-size:6rem">🚀</div>
    <h2>Space Shooter!</h2>
    <p>
      🖱️ <strong>حرّك الماوس</strong> لتحريك المركبة<br>
      🖱️ <strong>اضغط</strong> لإطلاق النار<br>
      💥 دمّر النجوم قبل أن تصلك!
    </p>
    <button id="start-btn">ابدأ اللعبة! 🚀</button>
  </div>

  <div id="hud">
    <span>🏆 <span class="label">نقاط:</span> <span id="score">0</span></span>
    <span>❤️ <span class="label">أرواح:</span> <span id="lives-hearts">❤️❤️❤️</span></span>
    <span>⭐ <span class="label">مستوى:</span> <span id="level">1</span></span>
  </div>
  <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width  = Math.min(window.innerWidth - 40, 700);
const H = canvas.height = Math.min(window.innerHeight - 120, 550);

// ── أصوات ──
function snd(f) { try { const a=new Audio('../sounds/'+f); a.preload='auto'; return a; } catch(e){ return {play:()=>{},currentTime:0}; } }
const SFX = {
  shoot:    snd('mixkit-retro-video-game-bubble-laser-277.wav'),
  explode:  snd('mixkit-game-blood-pop-slide-2363.wav'),
  hit:      snd('mixkit-player-losing-or-failing-2042.wav'),
  levelUp:  snd('mixkit-completion-of-a-level-2063.wav'),
  start:    snd('mixkit-medieval-show-fanfare-announcement-226.wav'),
  over:     snd('mixkit-long-game-over-notification-276.wav'),
};
function play(s){ try{ s.currentTime=0; s.play().catch(()=>{}); }catch(e){} }

let score=0, lives=3, level=1, running=false, animId;
let ship = { x: W/2, y: H-70, w:44, h:54 };
let bullets=[], enemies=[], particles=[], stars=[];
let mouseX = W/2;
let shootInterval, levelInterval;
let enemySpeed = 1.5;
let spawnRate = 1500;

// Create background stars
for(let i=0;i<80;i++){
  stars.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*2, spd:0.3+Math.random()*0.7 });
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('touchmove', e => {
  if(e.cancelable) e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : (e.changedTouches ? e.changedTouches[0].clientX : 0);
  mouseX = (clientX - rect.left) * (W / rect.width);
}, { passive: false });

function shoot() {
  if (!running) return;
  bullets.push({ x: ship.x, y: ship.y, spd: 10, w:4, h:14 });
  play(SFX.shoot);
  ship._flash = 5;
}

canvas.addEventListener('click', shoot);
canvas.addEventListener('touchstart', e => { if(e.cancelable) e.preventDefault(); shoot(); }, { passive: false });

function spawnEnemy() {
  if (!running) return;
  const types = [
    { emoji: '☄️', hp: 1, pts: 10, speed: enemySpeed, size: 36 },
    { emoji: '👾', hp: 2, pts: 20, speed: enemySpeed*0.8, size: 40 },
    { emoji: '🪐', hp: 3, pts: 40, speed: enemySpeed*0.6, size: 48 },
  ];
  const t = types[Math.floor(Math.random()*types.length)];
  enemies.push({
    x: 20 + Math.random()*(W-40), y: -50,
    ...t, maxHp: t.hp
  });
}

function spawnParticles(x, y, color, n=12) {
  for(let i=0;i<n;i++){
    const angle = Math.random()*Math.PI*2;
    const spd = 1+Math.random()*4;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
      life: 40+Math.random()*20, color, r: 2+Math.random()*4 });
  }
}

function update() {
  // Move ship
  ship.x += (mouseX - ship.x) * 0.12;
  ship.x = Math.max(ship.w/2, Math.min(W-ship.w/2, ship.x));

  // Bullets
  bullets = bullets.filter(b => b.y > -20);
  bullets.forEach(b => b.y -= b.spd);

  // Enemies
  enemies = enemies.filter(e => e.y < H+60);
  enemies.forEach(e => { e.y += e.speed; e.x += Math.sin(e.y/40)*0.8; });

  // Stars
  stars.forEach(s => { s.y+=s.spd; if(s.y>H) s.y=0; });

  // Particles
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life--; p.vx*=0.92; p.vy*=0.92; });
  particles = particles.filter(p => p.life>0);

  // Bullet-enemy collision
  bullets.forEach(b => {
    enemies.forEach(e => {
      const dx = b.x - e.x, dy = b.y - e.y;
      if (Math.abs(dx) < e.size/2 && Math.abs(dy) < e.size/2) {
        b.y = -100; e.hp--;
        spawnParticles(e.x, e.y, '#ffd93d', 6);
        if (e.hp <= 0) {
          score += e.pts;
          spawnParticles(e.x, e.y, '#ff6b6b', 18);
          e.y = H+100;
          play(SFX.explode);
          document.getElementById('score').textContent = score;
          checkLevel();
        }
      }
    });
  });

  // Enemy-ship collision
  enemies.forEach(e => {
    const dx = e.x - ship.x, dy = e.y - ship.y;
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) {
      e.y = H+100;
      lives--;
      spawnParticles(ship.x, ship.y, '#ff6b6b', 20);
      ship._hit = 20;
      play(SFX.hit);
      updateLives();
      if (lives<=0) gameOver();
    }
  });
}

function checkLevel() {
  const newLevel = Math.floor(score/200)+1;
  if(newLevel > level) {
    level = newLevel;
    enemySpeed = 1.5 + level*0.3;
    clearInterval(spawnTimer);
    spawnRate = Math.max(500, 1500 - level*100);
    spawnTimer = setInterval(spawnEnemy, spawnRate);
    document.getElementById('level').textContent = level;
    play(SFX.levelUp);
  }
}

function updateLives() {
  document.getElementById('lives-hearts').textContent = '❤️'.repeat(Math.max(0,lives));
}

function draw() {
  ctx.clearRect(0,0,W,H);

  // Sky gradient
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#000814');
  grad.addColorStop(1,'#001233');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Stars background
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+(0.4+s.r/2)+')';
    ctx.fill();
  });

  // Bullets
  bullets.forEach(b => {
    const g = ctx.createLinearGradient(b.x,b.y+b.h,b.x,b.y);
    g.addColorStop(0,'#4d96ff');
    g.addColorStop(1,'#fff');
    ctx.save();
    ctx.shadowBlur=12; ctx.shadowColor='#4d96ff';
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(b.x,b.y,b.w/2,b.h/2,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Enemies
  enemies.forEach(e => {
    ctx.font = e.size+'px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // HP bar
    if(e.hp<e.maxHp) {
      ctx.fillStyle='#ff0000';
      ctx.fillRect(e.x-20, e.y-e.size/2-10, 40, 5);
      ctx.fillStyle='#00ff88';
      ctx.fillRect(e.x-20, e.y-e.size/2-10, 40*(e.hp/e.maxHp), 5);
    }
    ctx.fillText(e.emoji, e.x, e.y);
  });

  // Particles
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life/60;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
    ctx.restore();
  });

  // Ship
  ctx.save();
  if (ship._hit>0) {
    ctx.globalAlpha = ship._hit%4<2 ? 0.4 : 1;
    ship._hit--;
  }
  ctx.shadowBlur=20; ctx.shadowColor='#4d96ff';
  ctx.font='44px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🚀', ship.x, ship.y);
  if(ship._flash>0){ ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(ship.x,ship.y-10,6,0,Math.PI*2); ctx.fill(); ship._flash--; }
  ctx.restore();
}

let spawnTimer;
function gameLoop() {
  update(); draw();
  animId = requestAnimationFrame(gameLoop);
}

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('overlay').style.display='none';
  score=0; lives=3; level=1; enemySpeed=1.5;
  bullets=[]; enemies=[]; particles=[];
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
  updateLives();
  running=true;
  play(SFX.start);
  clearInterval(spawnTimer);
  spawnTimer = setInterval(spawnEnemy, spawnRate);
  clearInterval(shootInterval);
  shootInterval = setInterval(shoot, 400);
  gameLoop();
});

function gameOver() {
  running=false;
  clearInterval(spawnTimer);
  clearInterval(shootInterval);
  cancelAnimationFrame(animId);
  play(SFX.over);
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <div style="font-size:5rem">💥</div>
    <h2 style="color:#ff6b6b">انتهت اللعبة!</h2>
    <p>نقاطك: <strong style="color:#ffd93d;font-size:2rem">${score}</strong><br>وصلت للمستوى ${level}</p>
    <button id="start-btn">العب مجدداً! 🚀</button>
  `;
  ov.style.display='flex';
  document.getElementById('start-btn').addEventListener('click', () => {
    ov.innerHTML=``;ov.style.display='none';
    score=0;lives=3;level=1;enemySpeed=1.5;spawnRate=1500;
    bullets=[];enemies=[];particles=[];
    document.getElementById('score').textContent='0';
    document.getElementById('level').textContent='1';
    updateLives();running=true;
    play(SFX.start);
    spawnTimer=setInterval(spawnEnemy,spawnRate);
    shootInterval=setInterval(shoot,400);
    gameLoop();
  });
}
</script>
</body>
</html>
