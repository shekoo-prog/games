<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🗡️ مغامرة الأرقام - Math Quest Saga</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0f0022;font-family:'Tajawal',sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#root{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}


.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(0,0,0,.6);border-bottom:2px solid #7b2fff;z-index:20;flex-shrink:0}
.back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 14px;border-radius:18px;cursor:pointer;font-size:13px;font-family:'Tajawal',sans-serif}
.stats{display:flex;gap:12px}
.pill{background:rgba(123,47,255,.15);border:1.5px solid rgba(123,47,255,.3);border-radius:20px;padding:4px 12px;font-size:13px;display:flex;align-items:center;gap:4px}
.pill b{color:#ffd700}


.xp-bar-cont{height:6px;background:rgba(255,255,255,.05);width:100%;z-index:15}
.xp-fill{height:100%;background:linear-gradient(90deg,#7b2fff,#00d4ff);width:0%;transition:width .4s}


.arena{flex:1;position:relative;background:radial-gradient(circle at center 70%,#2d1b69 0%,#0f0022 100%);overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none}
.arena-floor{position:absolute;bottom:0;left:0;right:0;height:100px;background:linear-gradient(180deg,transparent,rgba(10,0,30,.8))}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(123,47,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(123,47,255,.05) 1px,transparent 1px);background-size:40px 40px}


.ent{position:absolute;bottom:280px;transition:transform .4s cubic-bezier(.17,.67,.83,.67),opacity .4s}
.hero{left:15%;z-index:5}
.monst{right:15%;z-index:5}
.sprite{font-size:85px;filter:drop-shadow(0 0 10px rgba(0,0,0,.5));animation:float 3s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.hero.attacking{transform:translateX(100px) scale(1.2)}
.monst.damaged{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}


.hp-float{position:absolute;top:-50px;left:50%;transform:translateX(-50%);width:70px;height:7px;background:rgba(0,0,0,.4);border-radius:10px;border:1px solid rgba(255,50,50,.3);overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(90deg,#ff4444,#ff8888);width:100%;transition:width .4s}


.q-area{position:absolute;bottom:0;left:0;right:0;padding:15px;background:linear-gradient(0deg,#0f0022 80%,transparent);z-index:30}
.q-card{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid rgba(123,47,255,.3);border-radius:24px;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.q-txt{font-size:28px;font-weight:900;text-align:center;color:#ffd700;margin-bottom:18px;text-shadow:0 0 15px rgba(255,215,0,.4)}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans-btn{background:rgba(123,47,255,.15);border:2px solid rgba(123,47,255,.4);color:#fff;padding:14px;border-radius:16px;font-size:20px;font-weight:900;font-family:'Tajawal',sans-serif;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.ans-btn.correct{background:linear-gradient(135deg,#00cc66,#008844)!important;border-color:#00ff88!important;transform:scale(1.05)}
.ans-btn.wrong{background:linear-gradient(135deg,#ff4444,#cc0000)!important;border-color:#ffaaaa!important;animation:shake .4s}


.ov{position:fixed;inset:0;background:rgba(0,0,10,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:25px;text-align:center}
.ov-ico{font-size:80px;animation:float 2s infinite ease-in-out}
.ov-title{font-size:32px;font-weight:900;color:#7b2fff;margin:15px 0 8px}
.ov-desc{font-size:16px;color:rgba(255,255,255,.6);line-height:1.6;margin-bottom:25px;max-width:320px}
.ov-btn{background:linear-gradient(135deg,#7b2fff,#4f46e5);border:none;color:#fff;padding:15px 40px;border-radius:25px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 8px 25px rgba(123,47,255,.4);transition:.2s}


.dmg-pop{position:absolute;font-size:32px;font-weight:900;color:#ff4444;text-shadow:0 0 15px #ff4444;pointer-events:none;animation:rise-fade .8s forwards;z-index:50}
@keyframes rise-fade{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}


.sparkle{position:absolute;font-size:24px;pointer-events:none;animation:sparkle-fly 1.2s forwards}
@keyframes sparkle-fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
</style>
</head>
<body>
<div id="root">
  <div class="hud">
    <button class="back" onclick="location.href='../index.html'">← رجوع</button>
    <div class="stats">
      <div class="pill">🗡️ <b id="lvl">1</b></div>
      <div class="pill">🏆 <b id="kills">0</b></div>
    </div>
  </div>
  <div class="xp-bar-cont"><div class="xp-fill" id="xp"></div></div>
  <div class="arena" id="arena">
    <div class="grid-bg"></div>
    
    <div class="ent hero" id="hero-ent">
      <div class="hp-float"><div class="hp-fill" id="h-hp"></div></div>
      <div class="sprite">🧙</div>
    </div>
    
    <div class="platform" style="position:absolute;bottom:300px;right:12%;width:120px;height:20px;background:linear-gradient(180deg,#444,#111);border-radius:50% / 10px;border:2px solid #666;box-shadow:0 10px 20px rgba(0,0,0,.6)"></div>
    <div class="ent monst" id="mon-ent" style="bottom:330px">
      <div class="hp-float"><div class="hp-fill" id="m-hp"></div></div>
      <div class="sprite" id="mon-ico">👹</div>
    </div>
  </div>
  <div class="q-area">
    <div class="q-card">
      <div class="q-txt" id="q-txt">...</div>
      <div class="ans-grid" id="ans-grid"></div>
    </div>
  </div>
</div>

<div class="ov" id="st-ov">
  <div class="ov-ico">🛡️</div>
  <div class="ov-title">مغامرة الأرقام الاحترافية</div>
  <div class="ov-desc">أنت الساحر الصغير، استخدم قوة الحساب لهزيمة وحوش الظلام! كل إجابة صحيحة تطلق سحراً قوياً.</div>
  <button class="ov-btn" onclick="startGame()">ابدأ المعركة! 🗡️</button>
</div>

<div class="ov" id="win-ov" style="display:none">
  <div class="ov-ico">🌟</div>
  <div class="ov-title">ارتقيت للمستوى التالي!</div>
  <div class="ov-desc" id="win-desc">أنت الآن أقوى من قبل.</div>
  <button class="ov-btn" onclick="nextLv()">التالي ✨</button>
</div>

<div class="ov" id="end-ov" style="display:none">
  <div class="ov-ico">💀</div>
  <div class="ov-title" style="color:#ff4444">خسرت المعركة!</div>
  <div class="ov-desc">لا تستسلم، البطل يتعلم من أخطائه. حاول مرة أخرى!</div>
  <button class="ov-btn" onclick="location.reload()">العب مجدداً 🔄</button>
</div>

<script>

let lvl=1,kills=0,xp=0,playerHP=100,monsterHP=100,canAnswer=true;
let currentQ=null,timer=null;
const MON_ICONS=['👹','👺','👾','🐲','🦇','🧛','🧟'];

function startGame(){
  document.getElementById('st-ov').style.display='none';
  lvl=1;kills=0;xp=0;playerHP=100;
  spawnMonster();
  updateHUD();
}

function spawnMonster(){
  monsterHP=100 + (lvl*15);
  document.getElementById('m-hp').style.width='100%';
  document.getElementById('mon-ico').textContent=MON_ICONS[Math.floor(Math.random()*MON_ICONS.length)];
  document.getElementById('mon-ent').style.opacity='1';
  document.getElementById('mon-ent').style.transform='scale(1)';
  genQuestion();
}

function genQuestion(){
  canAnswer=true;
  const max=10+(lvl*2);
  const ops=['+','-','×'];
  const op=ops[Math.floor(Math.random()*ops.length)];
  let a=Math.floor(Math.random()*max)+1;
  let b=Math.floor(Math.random()*max)+1;
  let ans,q;
  if(op==='+'){ans=a+b;q=`${a} + ${b} = ?`;}
  else if(op==='-'){if(a<b)[a,b]=[b,a];ans=a-b;q=`${a} - ${b} = ?`;}
  else{a=Math.floor(Math.random()*Math.min(max,10))+1;b=Math.floor(Math.random()*Math.min(max,10))+1;ans=a*b;q=`${a} × ${b} = ?`;}
  currentQ=ans;
  document.getElementById('q-txt').textContent=q;
  
  const opts=[ans];
  while(opts.length<4){
    const w=ans+Math.floor(Math.random()*10)-5;
    if(w>=0&&!opts.includes(w))opts.push(w);
  }
  opts.sort(()=>Math.random()-.5);
  
  const grid=document.getElementById('ans-grid');
  grid.innerHTML='';
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='ans-btn';btn.textContent=o;
    btn.onclick=()=>checkAnswer(o,btn);
    grid.appendChild(btn);
  });
}

function checkAnswer(val,btn){
  if(!canAnswer)return;
  canAnswer=false;
  if(val===currentQ){
    btn.classList.add('correct');
    doHeroAttack();
  } else {
    btn.classList.add('wrong');
    doMonsterAttack();
  }
}

function doHeroAttack(){
  const hero=document.getElementById('hero-ent');
  const mon=document.getElementById('mon-ent');
  hero.classList.add('attacking');
  setTimeout(()=>{
    hero.classList.remove('attacking');
    mon.classList.add('damaged');
    const dmg=34+Math.floor(Math.random()*20);
    monsterHP-=dmg;
    showDmg(mon,dmg);
    document.getElementById('m-hp').style.width=Math.max(0,(monsterHP/(100+lvl*15))*100)+'%';
    if(monsterHP<=0)setTimeout(killMonster,400);
    else setTimeout(()=>mon.classList.remove('damaged'),400);
    setTimeout(genQuestion,800);
  },400);
}

function doMonsterAttack(){
  const mon=document.getElementById('mon-ent');
  const hero=document.getElementById('hero-ent');
  mon.classList.add('attacking'); 
  setTimeout(()=>{
    mon.classList.remove('attacking');
    hero.classList.add('damaged');
    const dmg=15+Math.floor(Math.random()*10);
    playerHP-=dmg;
    showDmg(hero,dmg);
    document.getElementById('h-hp').style.width=Math.max(0,playerHP)+'%';
    if(playerHP<=0)setTimeout(gameOver,400);
    else setTimeout(()=>hero.classList.remove('damaged'),400);
    setTimeout(genQuestion,800);
  },400);
}

function killMonster(){
  kills++;xp+=40;
  if(xp>=100){xp=0;lvl++;showLevelUp();}
  else{spawnMonster();}
  updateHUD();
}

function showLevelUp(){
  document.getElementById('win-desc').textContent=`أصبحت في المستوى ${lvl}! دقة حسابك زادت قوتك.`;
  document.getElementById('win-ov').style.display='flex';
}

function nextLv(){
  document.getElementById('win-ov').style.display='none';
  spawnMonster();
}

function gameOver(){
  document.getElementById('end-ov').style.display='flex';
}

function showDmg(ent,dmg){
  const el=document.createElement('div');
  el.className='dmg-pop';el.textContent='-'+dmg;
  const rect=ent.getBoundingClientRect();
  el.style.left=rect.left+(rect.width/2)+'px';
  el.style.top=rect.top+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),800);
  for(let i=0;i<5;i++)spawnSpark(rect.left+rect.width/2,rect.top);
}

function spawnSpark(x,y){
  const s=document.createElement('div');s.className='sparkle';
  s.textContent=['✨','⭐','💥'][Math.floor(Math.random()*3)];
  const dx=(Math.random()-.5)*200,dy=(Math.random()-.5)*200;
  s.style.cssText=`left:${x}px;top:${y}px;--dx:${dx}px;--dy:${dy}px`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),1200);
}

function updateHUD(){
  document.getElementById('lvl').textContent=lvl;
  document.getElementById('kills').textContent=kills;
  document.getElementById('xp').style.width=xp+'%';
}

resize();
</script>


<a href="../index.html" class="global-home-btn" style="position:fixed;top:15px;right:15px;background:rgba(0,0,0,0.5);color:#fff;text-decoration:none;font-family:sans-serif;font-weight:bold;padding:8px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);backdrop-filter:blur(10px);z-index:999999;display:flex;align-items:center;gap:8px;box-shadow:0 4px 15px rgba(0,0,0,0.3);transition:all 0.3s ease;">
  <span>🏠</span> عودة للرئيسية
</a>
<script>
  const btn = document.querySelector('.global-home-btn');
  btn.addEventListener('mouseover', () => { btn.style.background='rgba(255,255,255,0.1)'; btn.style.transform='translateY(-2px)'; });
  btn.addEventListener('mouseout', () => { btn.style.background='rgba(0,0,0,0.5)'; btn.style.transform='none'; });
</script>
</body>

</html>
