<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Daggers - نيون خنجر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050012;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      overflow: hidden;
      touch-action: none; 
      user-select: none;
    }
    
    #game-container {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b023f 0%, #050012 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 50px rgba(0, 229, 255, 0.05);
    }

    
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 10px 20px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
    }
    .hud-val { font-size: 26px; font-weight: 900; color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
    .hud-lbl { font-size: 11px; opacity: 0.7; letter-spacing: 1px; }

    .score-box { border-color: #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.1); }
    .score-box .hud-val { color: #ff0055; text-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }

    
    #knives-hud {
      position: absolute;
      bottom: 40px;
      left: 20px;
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      z-index: 10;
    }
    .knife-icon {
      width: 12px; height: 35px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      clip-path: polygon(50% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
      transition: all 0.3s;
    }
    .knife-icon.active { background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }
    
    
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 0, 18, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      text-align: center;
      transition: opacity 0.4s;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    h1 {
      font-size: 55px;
      font-weight: 900;
      background: linear-gradient(135deg, #00e5ff, #ff0055);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.4));
    }
    p.desc { color: rgba(255, 255, 255, 0.7); max-width: 320px; line-height: 1.6; margin-bottom: 30px; }
    
    .btn {
      background: linear-gradient(135deg, #00e5ff, #8a2be2);
      border: none;
      padding: 16px 45px;
      border-radius: 30px;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 229, 255, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.92); }
    .btn:hover { box-shadow: 0 10px 40px rgba(0, 229, 255, 0.5); transform: translateY(-3px); }

  </style>
</head>
<body>

<div id="game-container">
  <canvas id="c"></canvas>
  
  <div id="hud">
    <div class="hud-box">
      <div class="hud-lbl">المستوى</div>
      <div class="hud-val" id="ui-level">1</div>
    </div>
    <div class="hud-box score-box">
      <div class="hud-lbl">النقاط</div>
      <div class="hud-val" id="ui-score">0</div>
    </div>
  </div>

  <div id="knives-hud"></div>

  <div id="overlay">
    <h1 id="o-title">نيون خنجر<br>NEON DAGGER</h1>
    <p class="desc" id="o-desc">اضغط على الشاشة لرمي الخناجر على الهدف.<br>⚠️ احذر أن تضرب خنجرين ببعض!</p>
    <button class="btn" id="main-btn">العب الآن 🎯</button>
  </div>
</div>


<a href="../index.html" class="global-home-btn" style="position:fixed;top:15px;right:15px;background:rgba(0,0,0,0.5);color:#fff;text-decoration:none;font-family:'Tajawal',sans-serif;font-weight:bold;padding:8px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);backdrop-filter:blur(10px);z-index:999999;display:flex;align-items:center;gap:8px;box-shadow:0 4px 15px rgba(0,0,0,0.3);transition:all 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.transform='translateY(-2px)';" onmouseout="this.style.background='rgba(0,0,0,0.5)';this.style.transform='none';">
  <span>🏠</span> عودة للرئيسية
</a>

<script>
(()=>{
'use strict';

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const uiLevel = document.getElementById('ui-level');
const uiScore = document.getElementById('ui-score');
const oTitle = document.getElementById('o-title');
const oDesc = document.getElementById('o-desc');
const mainBtn = document.getElementById('main-btn');
const overlay = document.getElementById('overlay');
const knivesHud = document.getElementById('knives-hud');

let W, H;
let TARGET_Y, TARGET_R;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  canvas.width = W; canvas.height = H;
  TARGET_Y = H * 0.35;
  TARGET_R = Math.min(W, H) * 0.22;
}
window.addEventListener('resize', resize);
resize();


let AC = null, muted = false;
function actx() { if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(f, d, t='square', v=0.2, fDrop=0) {
  if (muted) return;
  try {
    const a = actx(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.type = t;
    o.frequency.setValueAtTime(f, a.currentTime);
    if(fDrop > 0) o.frequency.exponentialRampToValueAtTime(fDrop, a.currentTime + d);
    g.gain.setValueAtTime(v, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + d);
    o.start(); o.stop(a.currentTime + d);
  } catch(e){}
}
const sfx = {
  throw: () => tone(600, 0.08, 'sine', 0.15, 200),
  hit: () => { tone(150, 0.1, 'square', 0.3, 50); tone(300, 0.15, 'sawtooth', 0.2, 100); },
  metal: () => { tone(1200, 0.2, 'sine', 0.3, 200); tone(600, 0.3, 'sawtooth', 0.2); },
  break: () => { [300, 400, 500, 600, 800].forEach((f,i)=>setTimeout(()=>tone(f, 0.1, 'square', 0.2, 50), i*30)); }
};


const KNIFE_H = 60, KNIFE_W = 12;


let state = 'menu'; 
let score = 0, level = 1;

let targetRot = 0;
let targetSpeed = 0.02;
let rotationPlan = []; 
let rotTick = 0, currentStepIndex = 0;

let knivesTotal = 8;
let knivesLeft = 8;
let parkedKnives = []; 
let targetPreBuiltKnives = 0; 

let flyingKnife = null; 
let idleKnife = true;   

let particles = [];
let targetChunks = []; 
let shake = 0;

function buildLevel(lvl) {
  
  knivesTotal = Math.min(6 + Math.floor(lvl * 1.5), 18);
  knivesLeft = knivesTotal;
  
  
  parkedKnives = [];
  if (lvl > 1) {
    targetPreBuiltKnives = Math.min(Math.floor(lvl / 2), 4);
    for(let i=0; i<targetPreBuiltKnives; i++) {
      let rAngle;
      let isSafe = false;
      let attempts = 0;
      const minRot = (KNIFE_W * 2.5) / TARGET_R;
      while(!isSafe && attempts < 20) {
        rAngle = Math.random() * Math.PI * 2;
        isSafe = true;
        for(let pa of parkedKnives) {
          let diff = Math.abs(rAngle - pa);
          if (diff > Math.PI) diff = Math.PI*2 - diff;
          if (diff < minRot) { isSafe = false; break; }
        }
        attempts++;
      }
      parkedKnives.push(rAngle);
    }
  }

  
  rotationPlan = [];
  const baseSpeed = 0.02 + Math.min(lvl * 0.005, 0.08);
  const stepsCount = 1 + Math.floor(lvl / 2);
  
  for(let i=0; i<stepsCount; i++) {
    const dir = (Math.random() > 0.4) ? 1 : -1; 
    const speedMult = Math.random() * 1.5 + 0.5;
    const dur = Math.floor(Math.random() * 120 + 40); 
    rotationPlan.push({ speed: baseSpeed * dir * speedMult, t: dur });
    
    
    if (lvl >= 3 && Math.random() > 0.5) {
      rotationPlan.push({ speed: 0, t: Math.floor(Math.random() * 40 + 20) });
    }
  }
  
  rotTick = 0;
  currentStepIndex = 0;
  targetSpeed = rotationPlan[0].speed;
  
  updateKnivesHUD();
}

function updateKnivesHUD() {
  knivesHud.innerHTML = '';
  for(let i=0; i<knivesTotal; i++) {
    const k = document.createElement('div');
    k.className = 'knife-icon ' + (i < knivesTotal - knivesLeft ? 'active' : '');
    knivesHud.appendChild(k);
  }
}

function setupGame() {
  score = 0; level = 1;
  uiLevel.textContent = level;
  uiScore.textContent = score;
  targetRot = 0;
  particles = [];
  targetChunks = [];
  flyingKnife = null;
  idleKnife = true;
  buildLevel(level);
  overlay.classList.add('hidden');
  state = 'playing';
}

function nextLevel() {
  level++;
  uiLevel.textContent = level;
  targetRot = 0;
  particles = [];
  targetChunks = [];
  flyingKnife = null;
  idleKnife = true;
  buildLevel(level);
  state = 'playing';
}

function lose() {
  state = 'menu';
  shake = 30;
  sfx.metal();
  setTimeout(() => {
    oTitle.innerHTML = 'لقد خسرت 💥';
    oDesc.innerHTML = `المستوى: ${level}<br>نقاطك: ${score}`;
    mainBtn.innerHTML = 'إعادة اللعب 🔄';
    overlay.classList.remove('hidden');
  }, 1000);
}


function throwKnife() {
  if (state !== 'playing' || !idleKnife || flyingKnife) return;
  idleKnife = false;
  sfx.throw();
  flyingKnife = { y: H - KNIFE_H - 100, vy: -25 };
}

window.addEventListener('mousedown', throwKnife);
window.addEventListener('touchstart', (e)=>{ e.preventDefault(); throwKnife(); }, {passive:false});


function emitParticles(x, y, color, count=10) {
  for(let i=0; i<count; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = Math.random() * 5 + 2;
    particles.push({
      x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v,
      color, life: 1, dec: Math.random() * 0.05 + 0.02, size: Math.random() * 3 + 2
    });
  }
}

function breakTarget() {
  sfx.break();
  shake = 20;
  state = 'transition';
  
  
  for(let i=0; i<5; i++) {
    const a = (Math.PI*2/5)*i + Math.random();
    const v = Math.random() * 8 + 4;
    targetChunks.push({
      x: W/2, y: TARGET_Y,
      vx: Math.cos(a)*v, vy: Math.sin(a)*v - 4,
      rot: Math.random()*Math.PI, rotSp: (Math.random()-0.5)*0.2,
      type: 'chunk'
    });
  }
  
  
  parkedKnives.forEach(angle => {
    const absoluteAngle = angle + targetRot;
    const v = Math.random() * 5 + 5;
    targetChunks.push({
      x: W/2 - Math.sin(absoluteAngle)*TARGET_R,
      y: TARGET_Y + Math.cos(absoluteAngle)*TARGET_R,
      vx: -Math.sin(absoluteAngle)*v, 
      vy: Math.cos(absoluteAngle)*v - 4,
      rot: absoluteAngle, rotSp: (Math.random()-0.5)*0.3,
      type: 'knife'
    });
  });
  
  parkedKnives = [];
  
  setTimeout(nextLevel, 1500);
}


function update() {
  if (state === 'menu') return;
  
  if (shake > 0) shake--;

  
  if (state === 'playing') {
    rotTick++;
    if (rotationPlan.length > 0) {
      if (rotTick > rotationPlan[currentStepIndex].t) {
        rotTick = 0;
        currentStepIndex = (currentStepIndex + 1) % rotationPlan.length;
        
      }
      
      targetSpeed += (rotationPlan[currentStepIndex].speed - targetSpeed) * 0.1;
    }
    targetRot += targetSpeed;
  }

  
  if (flyingKnife) {
    flyingKnife.y += flyingKnife.vy;
    
    
    
    
    if (flyingKnife.y <= TARGET_Y + TARGET_R) {
      
      
      const hitAngle = -targetRot;
      
      
      const norm = (a) => ((a % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
      const hA = norm(hitAngle);
      
      let hitMetal = false;
      
      for (const pA of parkedKnives) {
        const normP = norm(pA);
        let diff = Math.abs(hA - normP);
        if (diff > Math.PI) diff = Math.PI*2 - diff; 
        
        
        
        const collisionAngle = (KNIFE_W * 1.5) / TARGET_R;
        if (diff < collisionAngle) { 
          hitMetal = true; break;
        }
      }
      
      if (hitMetal) {
        
        flyingKnife.vy = 10;
        flyingKnife.vx = (Math.random() - 0.5) * 15;
        flyingKnife.rot = 0;
        flyingKnife.rotVy = (Math.random() - 0.5) * 0.5;
        lose();
        emitParticles(W/2, TARGET_Y + TARGET_R, '#fff', 20);
      } else {
        
        sfx.hit();
        shake = 5;
        score += 15; uiScore.textContent = score;
        parkedKnives.push(hitAngle);
        knivesLeft--; 
        updateKnivesHUD();
        emitParticles(W/2, TARGET_Y + TARGET_R, '#00e5ff', 12);
        
        flyingKnife = null;
        if (knivesLeft <= 0) {
          breakTarget();
        } else {
          setTimeout(() => { idleKnife = true; }, 100);
        }
      }
    }
  } else if (state === 'menu' && flyingKnife) {
    
    flyingKnife.x = flyingKnife.x || W/2;
    flyingKnife.x += flyingKnife.vx;
    flyingKnife.y += flyingKnife.vy;
    flyingKnife.vy += 0.5; 
    flyingKnife.rot += flyingKnife.rotVy;
  }

  
  for(let i=particles.length-1; i>=0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.dec;
    if(p.life <= 0) particles.splice(i, 1);
  }
  
  
  for(let i=targetChunks.length-1; i>=0; i--) {
    let c = targetChunks[i];
    c.x += c.vx; c.y += c.vy; c.vy += 0.4; 
    c.rot += c.rotSp;
    if(c.y > H + 100) targetChunks.splice(i, 1);
  }
}


function drKnife(x, y, rot=0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  
  
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 10;
  
  
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(0, 0); 
  ctx.lineTo(KNIFE_W/2, KNIFE_H*0.7);
  ctx.lineTo(KNIFE_W/2, KNIFE_H);
  ctx.lineTo(-KNIFE_W/2, KNIFE_H);
  ctx.lineTo(-KNIFE_W/2, KNIFE_H*0.7);
  ctx.closePath();
  ctx.fill();
  
  
  ctx.fillStyle = '#00e5ff';
  ctx.fillRect(-1.5, KNIFE_H * 0.4, 3, KNIFE_H * 0.5);

  ctx.restore();
}

function drTarget() {
  ctx.save();
  ctx.translate(W/2, TARGET_Y);
  ctx.rotate(targetRot);
  
  
  ctx.shadowColor = '#ff0055';
  ctx.shadowBlur = 25;
  ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
  ctx.beginPath(); ctx.arc(0, 0, TARGET_R, 0, Math.PI*2); ctx.fill();

  
  const tg = ctx.createRadialGradient(0, 0, TARGET_R*0.2, 0, 0, TARGET_R);
  tg.addColorStop(0, '#100018');
  tg.addColorStop(0.8, '#ff0055');
  tg.addColorStop(1, '#ff88aa');
  
  ctx.fillStyle = tg;
  ctx.shadowBlur = 0; 
  ctx.beginPath(); ctx.arc(0, 0, TARGET_R, 0, Math.PI*2); ctx.fill();
  
  
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
  ctx.beginPath(); ctx.arc(0, 0, TARGET_R * 0.6, 0, Math.PI*2); ctx.stroke();
  
  ctx.setLineDash([10, 15]);
  ctx.strokeStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, TARGET_R * 0.85, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  
  
  parkedKnives.forEach(angle => {
    ctx.save();
    ctx.rotate(angle);
    
    
    
    ctx.translate(0, TARGET_R);
    
    
    drKnife(0, 0, 0); 
    ctx.restore();
  });

  ctx.restore();
}

function render() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  if (state === 'playing' || state === 'menu') {
    drTarget();
  }

  
  targetChunks.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    if(c.type === 'knife') {
      drKnife(0, 0, 0);
    } else {
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 10;
      ctx.beginPath();
      
      ctx.moveTo(-20, -30); ctx.lineTo(20, -10); ctx.lineTo(10, 30); ctx.lineTo(-30, 20);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  });

  
  if (state === 'playing') {
    if (idleKnife) drKnife(W/2, H - KNIFE_H - 80);
  }
  
  if (flyingKnife) {
    if(state === 'menu') {
      
      drKnife(flyingKnife.x, flyingKnife.y, flyingKnife.rot);
    } else {
      drKnife(W/2, flyingKnife.y);
    }
  }

  
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.restore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

mainBtn.addEventListener('click', setupGame);


loop();

})();
</script>
</body>
</html>
